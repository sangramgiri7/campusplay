<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CampusPlay</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect x='2' y='2' width='18' height='18' rx='5' fill='%230F766E'/%3E%3Crect x='22' y='12' width='16' height='16' rx='5' fill='%23F97316'/%3E%3Crect x='8' y='22' width='16' height='16' rx='5' fill='%2314B8A6'/%3E%3C/svg%3E">
<style>:root{--t:#0F766E;--bg:#F4F5F7;--card:#fff;--tx:#18212F;--mut:#667085;--bd:#E3E6EB;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif}
[data-theme=dark]{--bg:#0E1522;--card:#161F31;--tx:#E6EAF2;--mut:#98A2B3;--bd:#26314A}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);line-height:1.45;font-size:15px}
button,input,textarea{font:inherit;color:inherit}:focus-visible{outline:2px solid var(--t);outline-offset:2px}
[hidden]{display:none!important}small,.mut{color:var(--mut)}.center{text-align:center}small{font-size:.8rem}
h2{font-size:1.35rem;font-weight:650}h3{font-size:1rem;font-weight:650}.big{font-size:2.4rem}
.ic{width:20px;height:20px;display:block}
.app{display:grid;grid-template-columns:220px 1fr 300px;min-height:100vh}
.side{background:var(--card);border-right:1px solid var(--bd);padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.logo{display:flex;align-items:center;gap:9px;margin:0 6px 18px}.logo svg{width:34px;height:34px}.logo b{font-size:1.4rem;letter-spacing:-.6px}.logo em{color:var(--t);font-style:normal}
.side>small{margin:0 10px 4px;font-size:.68rem;letter-spacing:.08em}
.nav{display:grid;gap:2px}.nav small{margin:14px 10px 4px;font-size:.68rem;letter-spacing:.08em}
.nav button,.theme{display:flex;gap:11px;align-items:center;border:0;background:none;padding:10px 12px;border-radius:10px;cursor:pointer;font-weight:500;text-align:left;color:var(--mut)}
.nav button:hover,.theme:hover{background:var(--bg)}.nav button.on{background:rgba(15,118,110,.12);color:var(--t);font-weight:600}
.theme{margin-top:auto;border:1px solid var(--bd)}
#view{padding:22px;display:grid;gap:16px;align-content:start;min-width:0}
.right{background:var(--card);border-left:1px solid var(--bd);padding:18px;display:grid;gap:14px;align-content:start;height:100vh;overflow:auto;position:sticky;top:0}
.sec,.t{display:flex;justify-content:space-between;align-items:center;gap:8px}
.link{color:var(--t);font-weight:600;font-size:.8rem;cursor:pointer;background:none;border:0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px}
.btn{border:0;cursor:pointer;font-weight:600;padding:9px 16px;border-radius:10px;background:var(--t);color:#fff}
.btn:hover{filter:brightness(1.08)}.btn.o{background:none;color:var(--tx);border:1px solid var(--bd)}.btn.o:hover{background:var(--bg)}.btn.sm{padding:6px 12px;font-size:.82rem}.btn:disabled{opacity:.4;cursor:default;filter:none}
.head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.head h2{margin-bottom:2px}.head .btn{margin-right:4px}
.ov{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.av{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:50%;object-fit:cover;color:#fff;font-weight:700;flex:none}.av.xl{width:76px;height:76px;font-size:1.9rem}
.prof,.rank{display:grid;gap:6px;justify-items:center;text-align:center;align-content:center}.rank h2{margin-top:4px}
.bar{height:6px;border-radius:9px;background:var(--bd);overflow:hidden;width:100%}.bar i{display:block;height:100%;background:var(--t);border-radius:9px;transition:width .4s}
.radar{width:100%;max-width:180px;margin:auto;display:block}.radar .g{fill:none;stroke:var(--bd)}.radar .v{fill:rgba(15,118,110,.25);stroke:var(--t)}.radar text{fill:var(--mut)}
.gc{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px}
.game{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;display:grid;gap:10px;justify-items:start}
.gi{width:38px;height:38px;border-radius:10px;display:grid;place-items:center}.gr{flex:1;display:grid;min-width:0}
.rk{display:inline-flex;align-items:center;gap:5px;background:var(--bg);border:1px solid var(--bd);border-radius:99px;padding:2px 9px 2px 6px;font-size:.74rem;font-weight:600;white-space:nowrap}
.sh{display:block}
.tag{background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:1px 8px;font-size:.72rem;font-weight:600;white-space:nowrap}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
.qst{display:grid;gap:8px;padding:12px 0;border-bottom:1px solid var(--bd)}.qst:last-child{border:0}.qi{width:32px;height:32px;border-radius:8px;background:var(--bg);display:grid;place-items:center;flex:none;color:var(--t)}.qi .ic{width:18px;height:18px}
.lad{display:flex;gap:6px;align-items:center;padding:7px 0;border-bottom:1px solid var(--bd)}.lad:last-child{border:0}
.pl{border:1.5px solid var(--c);color:var(--c);border-radius:6px;padding:0 6px;font-weight:700;font-size:.7rem;min-width:24px;text-align:center}.pl.on{background:var(--c);color:#fff}
.row{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--bd)}.row .gr{font-weight:600}.row b.n{width:22px;color:var(--mut)}
.fr{display:flex;align-items:center;gap:10px;padding:6px 0}.fi{width:20px;flex:none}.fr b{font-weight:500;font-size:.88rem}
input.t{width:100%;max-width:300px;padding:9px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--bg)}
.avs{display:flex;gap:10px;justify-content:center}.avs button{width:34px;height:34px;border-radius:50%;border:3px solid var(--card);outline:2px solid var(--bd);cursor:pointer}.avs button.on{outline-color:var(--tx)}
#modal{position:fixed;inset:0;background:rgba(8,12,22,.6);display:grid;place-items:center;z-index:50;padding:10px}
.mbox{background:var(--card);border-radius:14px;padding:16px;width:min(440px,100%);max-height:96vh;overflow:auto}.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.mh button{border:0;background:var(--bg);border-radius:8px;width:30px;height:30px;cursor:pointer}
canvas{width:100%;max-height:66vh;border-radius:10px;touch-action:none;display:block;background:#10213A;margin:0 auto 8px}
.opt{display:block;width:100%;text-align:left;margin-top:8px;padding:12px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);cursor:pointer;font-weight:500}.opt:hover:not(:disabled){border-color:var(--t)}
.opt.ok{background:#D1FADF;border-color:#12B76A;color:#054F31}.opt.no{background:#FEE4E2;border-color:#F04438;color:#7A271A}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}.mem button{aspect-ratio:1;border:1px solid var(--bd);border-radius:10px;background:var(--bg);font-size:1.7rem;cursor:pointer;color:var(--t)}.mem button.f{background:var(--card);border-color:var(--t)}.mem button.m{background:#D1FADF;border-color:#12B76A}
.mem.m3{grid-template-columns:repeat(3,1fr)}.mem.m3 button{background:#E7D9C3}.mem.m3 button.up{background:#7C3F12}.mem.m3 button.up:after{content:"";display:block;width:46%;height:46%;margin:auto;border-radius:50%;background:#F5C98B}.mem.m3 button.hit{background:#F04438}
.pads{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}.pads button{height:92px;border:0;border-radius:12px;background:var(--c);opacity:.35;cursor:pointer}.pads button.on{opacity:1;transform:scale(.97)}
.gauge{width:100%;max-width:240px;display:block;margin:auto;color:var(--tx)}
.tx{background:var(--bg);border-radius:10px;padding:10px;font:500 .98rem/1.7 ui-monospace,Menlo,Consolas,monospace;margin:8px 0}.tx .ok{color:#12B76A}.tx .bad{color:#fff;background:#F04438;border-radius:3px}
.ta{width:100%;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--card);resize:none}
#toasts{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:99;display:grid;gap:8px}
.toast{background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:10px;font-weight:500;font-size:.9rem;animation:pop .2s}@keyframes pop{from{transform:translateY(-6px);opacity:0}}
@media(max-width:1150px){.app{grid-template-columns:200px 1fr}.right{grid-column:1/-1;height:auto;position:static;border-left:0;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}}
@media(max-width:800px){.app{grid-template-columns:1fr}.side{position:fixed;bottom:0;left:0;right:0;top:auto;height:auto;flex-direction:row;padding:4px;z-index:10;border-top:1px solid var(--bd);border-right:0}
 .side>small,.logo,.theme,.nav small{display:none}.nav{display:flex;width:100%;justify-content:space-around}.nav button{flex-direction:column;gap:2px;font-size:.66rem;padding:6px 8px;align-items:center}
 .ov,.two{grid-template-columns:1fr}#view{padding:14px 14px 0}.right{padding-bottom:84px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="logo"><svg viewBox="0 0 40 40" aria-hidden="true"><rect x="2" y="2" width="18" height="18" rx="5" fill="#0F766E"/><rect x="22" y="12" width="16" height="16" rx="5" fill="#F97316"/><rect x="8" y="22" width="16" height="16" rx="5" fill="#14B8A6"/></svg><b>campus<em>play.</em></b></div>
    <small>MY DESK</small>
    <nav class="nav">
      <button data-v="dash"><i></i><span>Dashboard</span></button>
      <button data-v="daily"><i></i><span>Daily challenges</span></button>

      <button data-v="board"><i></i><span>Ranks</span></button>

  <main id="view" aria-live="polite"></main>
  <aside class="right" id="right"></aside>
</div>
<div id="modal" hidden></div>
<div id="toasts" role="status"></div>
<script>
(function () {
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = t => String(t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const K = 'campusplay_v3', COLORS = ['#0F766E','#2563EB','#7C3AED','#DB2777','#EA580C','#475569'];
const fresh = () => ({ name: 'Student', col: 0, pic: '', pts: 0, best: { fb: 0, bb: 0, rn: 0, sn: 0, mm: 0, ms: 0, wpm: 0, qz: 0, mr: 0, pp: 0 }, qc: 0, hs: {}, played: 0, seen: [], tp: [], streak: 0, last: '', dq: null, theme: 'light', q: {} });
let S; try { S = JSON.parse(localStorage.getItem(K)); } catch (e) {}
S = (S && S.best) ? { ...fresh(), ...S, best: { ...fresh().best, ...S.best } } : fresh();
const save = () => { try { localStorage.setItem(K, JSON.stringify(S)); } catch (e) {} };
const day = () => new Date().toDateString(), yday = () => new Date(Date.now() - 864e5).toDateString();
const Q = () => { if (!S.q || S.q.d !== day() || !S.q.best) S.q = { d: day(), g: 0, set: [], cl: [], p: 0, best: {}, qr: 0 }; return S.q; };
const streak = () => (S.last === day() || S.last === yday()) ? S.streak : 0;
const level = () => Math.floor(S.pts / 200) + 1;

/* ---------- ranks: Bronze/Silver/Gold III-I, Platinum/Diamond V-I, Master/Legendary VII-I ---------- */
const RK = [['Bronze','#B4772F',3],['Silver','#8A99AD',3],['Gold','#D99A06',3],['Platinum','#0E9F8E',5],['Diamond','#2D9CDB',5],['Master','#8B45D6',7],['Legendary','#D8353A',7]];
const RN = ['I','II','III','IV','V','VI','VII'], TL = [], ST = [];
RK.forEach((r, ri) => { ST.push(TL.length); for (let k = r[2]; k >= 1; k--) TL.push({ ri, num: RN[k - 1], n: r[0] + ' ' + RN[k - 1], c: r[1] }); });
function T(v, cap, e = .85){
  const M = TL.length - 1; v = +v || 0;
  const i = Math.min(M, Math.floor(M * Math.pow(Math.max(0, v) / cap, e))), th = j => cap * Math.pow(j / M, 1 / e), lo = th(i), hi = th(i + 1);
  return { ...TL[i], i, pct: i >= M ? 100 : Math.max(0, Math.min(100, (v - lo) / (hi - lo) * 100)), nxt: i >= M ? null : Math.ceil(hi), next: i >= M ? '' : TL[i + 1].n };
}
const sh = (c, n, s = 22) => `<svg class="sh" width="${s}" height="${Math.round(s * 1.17)}" viewBox="0 0 24 28" aria-hidden="true"><path d="M12 1.5 21.5 5v8.5c0 6-4.2 10-9.5 13C6.7 23.5 2.5 19.5 2.5 13.5V5z" fill="${c}"/>${n ? `<text x="12" y="17" text-anchor="middle" font-size="${n.length > 3 ? 6.5 : n.length > 2 ? 8 : 10}" font-weight="700" fill="#fff">${n}</text>` : ''}</svg>`;
const rb = t => `<span class="rk">${sh(t.c, '', 13)}${t.n}</span>`;
const CAP = { fb: 40, bb: 60, rn: 200, sn: 30, mm: 110, ms: 30, wpm: 100, qz: 150, mr: 28, pp: 14 };
const val = k => k === 'qz' ? S.qc : S.best[k];
const OV = () => T(S.pts, 4000, 1);

/* ---------- icons ---------- */
const IC = {
 dash:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',

 qz:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 1-1 1.7M12 17h.01"/>',

};
const ic = k => `<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[k] || ''}</svg>`;

/* ---------- questions + typing paragraphs ---------- */
const BANK = [
['Which planet is called the Red Planet?',['Venus','Mars','Jupiter','Mercury'],1],

BANK.push(

['Which planet is farthest from the Sun?',['Saturn','Uranus','Neptune','Mars'],2],['What does AI stand for?',['Artificial Intelligence','Automatic Input','Advanced Internet','Applied Island'],0],
['What is decimal 4 in binary?',['011','100','101','110'],1],['Which metal is liquid at room temperature?',['Iron','Mercury','Copper','Zinc'],1],

function mole(){
  const el = modal('Mole Smash'); let sc = 0, t = 30, cur = -1, run = false, iv, mv;
  el.innerHTML = `<p class="center" id="mi">Tap the mole when it pops up. 30 seconds.</p><div class="mem m3">${[...Array(9)].map((_, i) => `<button data-i="${i}" aria-label="Hole ${i + 1}"></button>`).join('')}</div><div class="center"><button class="btn" id="st">Start</button> <small>Best <b id="bs">${S.best.ms}</b></small></div>`;
  const hs = [...el.querySelectorAll('.mem button')], info = () => { $('#mi').textContent = `Score ${sc} \u00B7 ${t}s`; };
  const show = () => { hs.forEach(h => h.className = ''); cur = Math.random() * 9 | 0; hs[cur].className = 'up'; };
  const nxt = () => { if (!run) return; show(); mv = setTimeout(nxt, Math.max(450, 850 - sc * 12)); };
  hs.forEach((h, i) => h.onclick = () => { if (run && i === cur){ sc++; cur = -1; h.className = 'hit'; info(); } });
  $('#st').onclick = () => { if (run) return; run = true; sc = 0; t = 30; info(); nxt();
    iv = setInterval(() => { t--; info(); if (t <= 0){ run = false; clearInterval(iv); clearTimeout(mv); hs.forEach(h => h.className = ''); finish('ms', sc, 2, 60);
      $('#mi').innerHTML = `Time. Score ${sc} \u00B7 ${rb(T(val('ms'), CAP.ms))}`; $('#st').textContent = 'Play again'; } }, 1000); };
  stopG = () => { run = false; clearInterval(iv); clearTimeout(mv); };
}
function mathrush(){
  const el = modal('Math Rush'); let sc = 0, t = 30, run = false, iv, v;
  el.innerHTML = `<p class="center" id="mi">Solve as many as you can in 30 seconds. A wrong answer costs 3 seconds.</p><h2 class="center big" id="mq">&nbsp;</h2><div id="mo"></div><div class="center"><button class="btn" id="st">Start</button> <small>Best <b id="bs">${S.best.mr}</b></small></div>`;
  const info = () => { $('#mi').textContent = `Score ${sc} \u00B7 ${t}s`; };
  const R = n => 2 + (Math.random() * n | 0);
  const next = () => {
    const r = Math.random(), a = R(sc < 5 ? 9 : sc < 12 ? 25 : 50), b = R(sc < 8 ? 9 : 14); let q;
    if (r < .4){ q = `${a} + ${b}`; v = a + b; } else if (r < .7){ q = `${a + b} \u2212 ${b}`; v = a; } else { const m = R(sc < 8 ? 8 : 11), n = R(sc < 8 ? 8 : 11); q = `${m} \u00D7 ${n}`; v = m * n; }
    const o = new Set([v]); while (o.size < 4){ const d = (Math.random() * 10 | 0) - 5, w = v + d; if (d && w >= 0) o.add(w); }
    $('#mq').textContent = q; $('#mo').innerHTML = [...o].sort(() => Math.random() - .5).map(n => `<button class="opt" data-n="${n}">${n}</button>`).join('');
    $$('#mo .opt').forEach(b => b.onclick = () => { if (!run) return; if (+b.dataset.n === v) sc++; else t = Math.max(0, t - 3); info(); if (t <= 0) end(); else next(); });
  };
  const end = () => { if (!run) return; run = false; clearInterval(iv); $('#mo').innerHTML = ''; $('#mq').innerHTML = '&nbsp;'; finish('mr', sc, 3, 60); $('#mi').innerHTML = `Time. Score ${sc} \u00B7 ${rb(T(val('mr'), CAP.mr))}`; $('#st').textContent = 'Play again'; };
  $('#st').onclick = () => { if (run) return; run = true; sc = 0; t = 30; info(); next(); iv = setInterval(() => { t--; info(); if (t <= 0) end(); }, 1000); };
  stopG = () => { run = false; clearInterval(iv); };
}
function pulse(){
  const el = modal('Pattern Pulse'); let seq = [], pos = 0, busy = true, run = false, alive = true;
  const C = ['#16A34A','#DC2626','#EAB308','#2563EB'];
  el.innerHTML = `<p class="center" id="mi">Watch the pattern, then repeat it.</p><div class="pads">${C.map((c, i) => `<button data-i="${i}" style="--c:${c}" aria-label="Pad ${i + 1}"></button>`).join('')}</div><div class="center"><button class="btn" id="st">Start</button> <small>Best <b id="bs">${S.best.pp}</b></small></div>`;
  const pads = [...el.querySelectorAll('.pads button')], lit = (i, ms = 380) => { pads[i].classList.add('on'); setTimeout(() => pads[i].classList.remove('on'), ms); };
  const play = () => { busy = true; pos = 0; $('#mi').textContent = 'Watch...'; seq.push(Math.random() * 4 | 0);
    seq.forEach((p, k) => setTimeout(() => { if (alive) lit(p); }, 600 + k * 650)); setTimeout(() => { if (alive){ busy = false; $('#mi').textContent = 'Your turn'; } }, 600 + seq.length * 650); };
  pads.forEach((b, i) => b.onclick = () => {
    if (busy || !run) return; lit(i, 200);
    if (i !== seq[pos]){ run = false; busy = true; const sc = seq.length - 1; finish('pp', sc, 5, 60); $('#mi').innerHTML = `Missed. Rounds completed: ${sc} \u00B7 ${rb(T(val('pp'), CAP.pp))}`; $('#st').textContent = 'Play again'; return; }
    pos++; if (pos === seq.length){ busy = true; $('#mi').textContent = 'Correct'; setTimeout(() => { if (alive && run) play(); }, 700); }
  });
  $('#st').onclick = () => { if (run) return; run = true; seq = []; play(); };
  stopG = () => { alive = false; };
}
const gauge = w => { const p = Math.min(w, 100); return `<svg viewBox="0 0 200 124" class="gauge" role="img" aria-label="Typing speed meter"><defs><linearGradient id="gg"><stop offset="0" stop-color="#14B8A6"/><stop offset=".6" stop-color="#F59E0B"/><stop offset="1" stop-color="#EF4444"/></linearGradient></defs><path d="M20 100A80 80 0 0 1 180 100" fill="none" stroke="var(--bd)" stroke-width="14" stroke-linecap="round"/><path class="ga" d="M20 100A80 80 0 0 1 180 100" fill="none" stroke="url(#gg)" stroke-width="14" stroke-linecap="round" pathLength="100" stroke-dasharray="${p} 100"/><g class="nd" style="transform-origin:100px 100px;transform:rotate(${-90 + p * 1.8}deg)"><line x1="100" y1="100" x2="100" y2="38" stroke="var(--tx)" stroke-width="3" stroke-linecap="round"/></g><circle cx="100" cy="100" r="6" fill="var(--tx)"/><text class="gw" x="100" y="120" text-anchor="middle" font-size="16" font-weight="700" fill="currentColor">${w} WPM</text></svg>`; };
function typing(){
  const el = modal('Typing Speed'), text = pickPara(); let t0 = 0, fin = false, iv;
  el.innerHTML = `${gauge(0)}<div class="tx" id="tx">${[...text].map(c => `<span>${esc(c)}</span>`).join('')}</div><textarea class="ta" id="ti" rows="2" placeholder="Start typing to begin the 30 second timer" aria-label="Type the text above" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea><p class="center mut" id="ts">0 WPM \u00B7 100% accuracy \u00B7 30s</p><p class="center"><small>Best <b id="bs">${S.best.wpm}</b> WPM</small></p>`;
  const sp = [...el.querySelectorAll('#tx span')], ti = $('#ti');
  const calc = () => { const v = ti.value; let ok = 0; sp.forEach((s, i) => { const r = i < v.length; s.className = !r ? '' : v[i] === text[i] ? 'ok' : 'bad'; if (r && v[i] === text[i]) ok++; });
    const m = Math.max(Date.now() - t0, 3000) / 60000; return { w: Math.round(ok / 5 / m), a: v.length ? Math.round(ok / v.length * 100) : 100, n: v.length }; };
  const upd = w => { const p = Math.min(w, 100); el.querySelector('.ga').setAttribute('stroke-dasharray', p + ' 100'); el.querySelector('.nd').style.transform = `rotate(${-90 + p * 1.8}deg)`; el.querySelector('.gw').textContent = w + ' WPM'; };
  const end = r => { fin = true; clearInterval(iv); ti.disabled = true; finish('wpm', r.w, 1, 50);
    el.insertAdjacentHTML('beforeend', `<div class="center"><h3>${r.w} WPM \u00B7 ${r.a}% accuracy</h3><p>${rb(T(r.w, CAP.wpm))}</p><button class="btn" id="ag">New paragraph</button></div>`); $('#ag').onclick = typing; };
  const tick = () => { if (fin) return; const r = calc(), left = Math.max(0, 30 - Math.floor((Date.now() - t0) / 1000)); upd(r.w); $('#ts').textContent = `${r.w} WPM \u00B7 ${r.a}% accuracy \u00B7 ${left}s`; if (r.n >= text.length || left <= 0) end(r); };
  ti.oninput = () => { if (!t0){ t0 = Date.now(); iv = setInterval(tick, 250); } tick(); };
  stopG = () => clearInterval(iv); setTimeout(() => ti.focus(), 60);
}
function quiz(){
  const el = modal('Brain Quiz'), left = BANK.length - S.seen.length;
  el.innerHTML = `<div class="center"><h2>5 new questions</h2><p class="mut">${left} of ${BANK.length} questions you have not seen yet</p><button class="btn" id="go">Start</button></div>`;
  $('#go').onclick = () => ask(el, pick(5), 12, sc => { const q = Q(); q.qr += sc; S.qc += sc; finish('qz', sc, 12, 60);
    el.innerHTML = `<div class="center"><h2>${sc}/5 correct</h2><p>${rb(T(S.qc, CAP.qz))}</p><button class="btn" id="ag">Play again</button></div>`; $('#ag').onclick = quiz; });
}
function dailyQuiz(){
  const el = modal('Daily Quiz'), q = Q();
  if (S.dq && S.dq.d === day()){ el.innerHTML = `<div class="center"><h2>Done for today</h2><p>You scored ${S.dq.s}/10.</p><p class="mut">Streak: ${streak()} day(s). New questions tomorrow.</p></div>`; return; }
  el.innerHTML = `<div class="center"><h2>Today\u2019s 10 questions</h2><p class="mut">The set changes every day. 15 seconds each.</p><button class="btn" id="go">Start</button></div>`;
  $('#go').onclick = () => ask(el, seeded(10), 15, sc => {
    S.streak = S.last === yday() ? S.streak + 1 : 1; S.last = day(); S.dq = { d: day(), s: sc }; S.qc += sc; S.played++; q.g++; q.best.dq = sc; if (!q.set.includes('dq')) q.set.push('dq');
    givePts(sc * 8 + (sc >= 7 ? 20 : 0)); save(); el.innerHTML = `<div class="center"><h2>${sc}/10 correct</h2><p>Streak: ${S.streak} day(s)</p></div>`; });
}

/* ---------- daily challenges: different mix every day ---------- */
const TG = { fb: [3,6,10], bb: [8,14,20], rn: [25,50,80], sn: [4,7,11], mm: [40,70,90], ms: [8,13,18], mr: [6,10,14], pp: [4,6,8], wpm: [15,25,35] };
function DC(){
  const r = rnd(dseed() + 11), pool = GAMES.filter(g => g[0] !== 'qz').map(g => 'g:' + g[0]).concat(['hop', 'play', 'right']);
  for (let i = pool.length - 1; i > 0; i--){ const j = r() * (i + 1) | 0; [pool[i], pool[j]] = [pool[j], pool[i]]; }
  const need = 5 + (r() * 4 | 0), out = [['dq', 'Daily Quiz', 'Get ' + need + ' or more right in today\u2019s 10 new questions', q => q.best.dq || 0, need, 60 + need * 5, dailyQuiz, 'daily']];
  pool.slice(0, 3).forEach(p => {
    if (p[0] === 'g'){ const k = p.slice(2), l = r() * 3 | 0, t = TG[k][l]; out.push(['g' + k, gname(k) + ' target', 'Score ' + t + (k === 'wpm' ? ' WPM' : '') + ' in ' + gname(k), q => q.best[k] || 0, t, 50 + l * 20, GI(k)[3], k]); }
    else if (p === 'hop'){ const n = 3 + (r() * 3 | 0); out.push(['hop', 'Game hopper', 'Play ' + n + ' different games today', q => q.set.length, n, 40 + n * 10, () => go('games'), 'games']); }
    else if (p === 'play'){ const n = 4 + (r() * 4 | 0); out.push(['play', 'Keep going', 'Finish ' + n + ' games today', q => q.g, n, 40 + n * 8, () => go('games'), 'games']); }
    else { const n = 6 + 2 * (r() * 5 | 0); out.push(['right', 'Sharp mind', 'Get ' + n + ' answers right in Brain Quiz today', q => q.qr, n, 40 + n * 4, quiz, 'qz']); }
  });
  return out;
}
function claim(id){ const d = DC().find(x => x[0] === id), q = Q(); if (d && d[3](q) >= d[4] && !q.cl.includes(id)){ q.cl.push(id); givePts(d[5]); refresh(); } }
const rows = list => { const q = Q(); return list.map(d => { const v = Math.min(d[3](q), d[4]), ok = v >= d[4], cl = q.cl.includes(d[0]);
  return `<div class="qst"><div class="t"><span class="qi">${ic(d[7])}</span><div class="gr"><b>${d[1]}</b><small>${d[2]}</small></div><span class="tag">+${d[5]}</span></div><div class="bar"><i style="width:${v / d[4] * 100}%"></i></div>
  <div class="t"><small>${v} / ${d[4]}</small>${cl ? '<small>Claimed</small>' : `<span><button class="btn o sm" data-s="${d[0]}">Start</button> <button class="btn sm" data-c="${d[0]}" ${ok ? '' : 'disabled'}>Claim</button></span>`}</div></div>`; }).join(''); };
function bind(){
  $$('[data-go]').forEach(b => b.onclick = () => go(b.dataset.go)); $$('[data-p]').forEach(b => b.onclick = () => GI(b.dataset.p)[3]());
  $$('[data-s]').forEach(b => b.onclick = () => DC().find(x => x[0] === b.dataset.s)[6]()); $$('[data-c]').forEach(b => b.onclick = () => claim(b.dataset.c));
  $$('[data-ca]').forEach(b => b.onclick = () => DC().forEach(d => claim(d[0])));
}

/* ---------- views ---------- */
const gcards = () => `<div class="gc">${GAMES.map(g => `<div class="game"><div class="gi" style="color:${g[2]};background:${g[2]}1f">${ic(g[0])}</div><div class="gr"><b>${g[1]}</b><small>Best ${bt(g[0])}</small></div>${rb(T(val(g[0]), CAP[g[0]]))}<button class="btn o sm" data-p="${g[0]}">Play</button></div>`).join('')}</div>`;
function radar(){
  const L = ['Reflex','Focus','Speed','Knowledge','Typing'], v = ['fb','bb','rn','qz','wpm'].map(k => T(val(k), CAP[k]).i / (TL.length - 1));
  const pt = (i, r) => { const a = -Math.PI / 2 + i * 2 * Math.PI / 5; return [(70 + Math.cos(a) * r).toFixed(1), (70 + Math.sin(a) * r).toFixed(1)]; };
  const poly = f => L.map((_, i) => pt(i, f(i)).join(',')).join(' ');
  return `<svg viewBox="0 0 140 140" class="radar" role="img" aria-label="Skill chart"><polygon points="${poly(() => 50)}" class="g"/><polygon points="${poly(() => 25)}" class="g"/><polygon points="${poly(i => Math.max(4, v[i] * 50))}" class="v"/>${L.map((l, i) => { const p = pt(i, 62); return `<text x="${p[0]}" y="${p[1]}" text-anchor="middle" font-size="7">${l}</text>`; }).join('')}</svg>`;
}
const ladder = () => { const c = OV().i; return RK.map((r, ri) => `<div class="lad"><span style="display:flex;align-items:center;gap:8px;flex:1">${sh(r[1], '', 14)}<b>${r[0]}</b></span>${Array.from({ length: r[2] }, (_, k) => r[2] - k).map((n, k) => `<span class="pl ${ST[ri] + k <= c ? 'on' : ''}" style="--c:${r[1]}">${RN[n - 1]}</span>`).join('')}</div>`).join(''); };
const V = {
  dash(){
    const o = OV(), h = new Date().getHours(), dc = DC(), q = Q(), done = dc.filter(d => q.cl.includes(d[0])).length;
    $('#view').innerHTML = `
    <div class="card head"><div><h2>${h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening'}, ${esc(S.name)}</h2><p class="mut">${o.n} \u00B7 ${streak()} day streak \u00B7 ${done} of ${dc.length} challenges claimed today</p></div><div><button class="btn" data-go="daily">Daily challenges</button> <button class="btn o" data-go="games">All games</button></div></div>
    <div class="ov">
      <div class="card prof">${av('xl')}<b>${esc(S.name)}</b><small>Level ${level()} \u00B7 ${S.pts} points</small><div class="bar"><i style="width:${(S.pts % 200) / 2}%"></i></div><small>${S.pts % 200} / 200 XP</small></div>
      <div class="card rank">${sh(o.c, o.num, 64)}<h2>${o.n}</h2><small>${o.nxt ? (o.nxt - S.pts) + ' points to ' + o.next : 'Highest rank reached'}</small><div class="bar"><i style="width:${o.pct}%;background:${o.c}"></i></div></div>
      <div class="card"><h3>Skills</h3>${radar()}</div></div>
    <div class="sec"><h3>Games</h3><button class="link" data-go="games">See all</button></div>${gcards()}
    <div class="two"><div class="card"><div class="sec"><h3>Today\u2019s challenges</h3><button class="link" data-ca>Claim all</button></div>${rows(dc.slice(0, 3))}</div><div class="card"><div class="sec"><h3>Rank ladder</h3><button class="link" data-go="board">Details</button></div>${ladder()}</div></div>`;
    bind();
  },
  daily(){ $('#view').innerHTML = `<div class="sec"><h2>Daily challenges</h2><button class="btn sm" data-ca>Claim all</button></div><div class="card">${rows(DC())}</div><p class="mut">The mix of challenges, targets and quiz questions changes every day. Streak: ${streak()} day(s).</p>`; bind(); },
  games(){ $('#view').innerHTML = `<h2>Games</h2>${gcards()}<p class="mut">Points are given for your first 8 games each day. Controls: tap, click, swipe, Space or arrow keys.</p>`; bind(); },
  board(){
    $('#view').innerHTML = `<h2>Ranks and records</h2><div class="card"><div class="sec"><h3>Rank ladder</h3>${rb(OV())}</div>${ladder()}</div>
    <div class="two">${GAMES.map(g => { const t = T(val(g[0]), CAP[g[0]]), h = S.hs[g[0]] || []; return `<div class="card"><div class="sec"><h3>${g[1]}</h3>${rb(t)}</div><div class="bar"><i style="width:${t.pct}%;background:${t.c}"></i></div><small>${t.next ? 'Next: ' + t.next : 'Highest rank reached'}</small>
      <div>${h.length ? h.map((s, i) => `<div class="row"><b class="n">${i + 1}</b><div class="gr">${s}${g[0] === 'wpm' ? ' WPM' : ''}</div></div>`).join('') : '<small>No records yet.</small>'}</div></div>`; }).join('')}</div>`;
  },
  prof(){
    $('#view').innerHTML = `<h2>Profile</h2><div class="card center">${av('xl')}<h3>${esc(S.name)}</h3><p>${rb(OV())}</p><br><div class="avs">${COLORS.map((c, i) => `<button data-a="${i}" class="${S.col === i && !S.pic ? 'on' : ''}" style="background:${c}" aria-label="Colour ${i + 1}"></button>`).join('')}</div><br>
      <label class="btn o sm" for="pf" style="display:inline-block;cursor:pointer">Upload photo</label><input id="pf" type="file" accept="image/*" hidden> <button class="btn o sm" id="rp">Remove photo</button><br><br>
      <input class="t" id="nm" maxlength="24" value="${esc(S.name)}" aria-label="Display name"><br><br><button class="btn" id="sv">Save name</button> <button class="btn o" id="th">Dark / light</button> <button class="btn o" id="rs">Reset progress</button></div>`;
    $$('[data-a]').forEach(b => b.onclick = () => { S.col = +b.dataset.a; S.pic = ''; save(); refresh(); });
    $('#sv').onclick = () => { const n = $('#nm').value.trim(); if (n.length < 2){ toast('Name needs 2 or more characters'); return; } S.name = n; save(); toast('Saved'); refresh(); };
    $('#th').onclick = theme; $('#rp').onclick = () => { S.pic = ''; save(); refresh(); };
    let sure = false; $('#rs').onclick = e => { if (!sure){ sure = true; e.target.textContent = 'Tap again to confirm'; setTimeout(() => { sure = false; const b = $('#rs'); if (b) b.textContent = 'Reset progress'; }, 3000); return; } const t = S.theme; S = fresh(); S.theme = t; save(); go('dash'); right(); };
    $('#pf').onchange = e => { const f = e.target.files[0]; if (!f) return; if (!f.type.startsWith('image/')){ toast('Choose an image file'); return; }
      const r = new FileReader(), im = new Image(); r.onload = () => { im.onload = () => { const cv = document.createElement('canvas'); cv.width = cv.height = 96; const s = Math.min(im.width, im.height);
        cv.getContext('2d').drawImage(im, (im.width - s) / 2, (im.height - s) / 2, s, s, 0, 0, 96, 96); S.pic = cv.toDataURL('image/jpeg', .75); save(); toast('Photo updated'); refresh(); }; im.onerror = () => toast('Could not read that image'); im.src = r.result; }; r.readAsDataURL(f); };
  }
};
function right(){
  const done = S.dq && S.dq.d === day();
  $('#right').innerHTML = `<div class="card"><h3>${streak()} day streak</h3><small>${day()}</small><br><button class="btn" id="rq" style="margin-top:10px;width:100%">${done ? 'Daily quiz done' : 'Start daily quiz'}</button></div>
  <div class="card"><h3>Typing meter</h3>${gauge(S.best.wpm)}<p class="center">${rb(T(S.best.wpm, CAP.wpm))}</p><p class="center"><button class="btn o sm" id="rt">Test my speed</button></p></div>
  <div class="card"><h3>My ranks</h3>${GAMES.map(g => `<div class="fr"><span class="fi" style="color:${g[2]}">${ic(g[0])}</span><div class="gr"><b>${g[1]}</b></div>${rb(T(val(g[0]), CAP[g[0]]))}</div>`).join('')}</div>`;
  $('#rq').onclick = dailyQuiz; $('#rt').onclick = typing;
}
function theme(){ S.theme = S.theme === 'dark' ? 'light' : 'dark'; save(); document.documentElement.dataset.theme = S.theme; }
function go(v){ stopG(); stopG = () => {}; clearInterval(TT); view = v; $$('.nav button').forEach(b => b.classList.toggle('on', b.dataset.v === v)); V[v](); scrollTo(0, 0); }
$$('.nav button').forEach(b => { b.querySelector('i').innerHTML = ic(b.dataset.v); b.onclick = () => go(b.dataset.v); }); $('#theme').onclick = theme;
document.documentElement.dataset.theme = S.theme; Q(); go('dash'); right();

})();
</script>
